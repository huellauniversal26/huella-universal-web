<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado del pago — Huella Universal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Work+Sans:wght@400;500&display=swap');
  body{
    margin:0; background:#111111; color:#FFFFFF; font-family:'Work Sans',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .box{ max-width:440px; }
  .icon{ font-size:48px; margin-bottom:18px; }
  h1{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:26px; margin-bottom:14px; color:#D4AF37; }
  p{ color:#BDBDBD; font-size:15px; line-height:1.6; margin-bottom:28px; }
  a{
    display:inline-block; background:#D4AF37; color:#111111; text-decoration:none;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.04em; padding:13px 24px; border-radius:2px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon" id="icon">…</div>
    <h1 id="title">Consultando el pago…</h1>
    <p id="message">Un momento.</p>
    <a href="/">Volver a la tienda</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = params.get('transactionState') || params.get('polTransactionState') || '';

    const info = {
      '4': {
        icon: '✓',
        title: '¡Pago exitoso!',
        message: 'Gracias por tu compra en Huella Universal. Te contactaremos pronto por WhatsApp para coordinar la entrega.'
      },
      '6': {
        icon: '✕',
        title: 'El pago no se completó',
        message: 'Algo salió mal con tu pago. Puedes intentarlo de nuevo o escribirnos por WhatsApp y te ayudamos a completar tu compra.'
      },
      '7': {
        icon: '…',
        title: 'Pago pendiente',
        message: 'Tu pago está siendo procesado (algunos medios como PSE pueden tardar unos minutos). Te avisaremos por correo o WhatsApp en cuanto se confirme.'
      },
      '104': {
        icon: '✕',
        title: 'Ocurrió un error',
        message: 'No pudimos procesar el pago. Intenta de nuevo o escríbenos por WhatsApp para ayudarte a completar tu compra.'
      }
    };

    const data = info[state] || {
      icon: '?',
      title: 'Resultado del pago',
      message: 'No pudimos confirmar el estado exacto de tu pago. Si el dinero salió de tu cuenta, escríbenos por WhatsApp con tu nombre y te confirmamos el pedido.'
    };

    document.getElementById('icon').textContent = data.icon;
    document.getElementById('title').textContent = data.title;
    document.getElementById('message').textContent = data.message;
  </script>
</body>
</html>
